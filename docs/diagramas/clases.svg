<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1320" height="900" fill="#ffffff"/>
  <style>
    .cls  { fill:#f6f6fa; stroke:#3f3f5a; stroke-width:1.8; }
    .hdr  { fill:#e3e3ee; stroke:#3f3f5a; stroke-width:1.8; }
    .name { font-size:19px; fill:#1a1a1a; font-weight:bold; text-anchor:middle; }
    .ster { font-size:14px; fill:#6a6a82; text-anchor:middle; font-style:italic; }
    .attr { font-size:15px; fill:#1a1a1a; }
    .rel  { stroke:#3f3f5a; stroke-width:1.6; fill:none; }
    .lbl  { font-size:14px; fill:#4a4a60; }
  </style>

  <!-- Exam -->
  <rect class="hdr" x="60" y="60" width="290" height="34"/>
  <rect class="cls" x="60" y="94" width="290" height="266"/>
  <text class="name" x="205" y="84">Exam</text>
  <g class="attr">
    <text x="72" y="116">+ id : number</text>
    <text x="72" y="139">+ subject : string</text>
    <text x="72" y="162">+ subject_va? : string</text>
    <text x="72" y="185">+ subject_en? : string</text>
    <text x="72" y="208">+ acronym? : string</text>
    <text x="72" y="231">+ date : string</text>
    <text x="72" y="254">+ time : string</text>
    <text x="72" y="277">+ duration_minutes : number</text>
    <text x="72" y="300">+ location : string</text>
    <text x="72" y="323">+ school, degree : string</text>
    <text x="72" y="346">+ year, semester : string</text>
  </g>

  <!-- ExamFilters -->
  <rect class="hdr" x="60" y="470" width="290" height="34"/>
  <rect class="cls" x="60" y="504" width="290" height="150"/>
  <text class="name" x="205" y="494">ExamFilters</text>
  <g class="attr">
    <text x="72" y="526">+ school? : string[]</text>
    <text x="72" y="549">+ degree? : string[]</text>
    <text x="72" y="572">+ year? : string[]</text>
    <text x="72" y="595">+ semester? : string[]</text>
    <text x="72" y="618">+ subject? : string[]</text>
    <text x="72" y="641">+ acronym? : string</text>
  </g>

  <!-- SubjectOption -->
  <rect class="hdr" x="60" y="722" width="290" height="34"/>
  <rect class="cls" x="60" y="756" width="290" height="104"/>
  <text class="name" x="205" y="746">SubjectOption</text>
  <g class="attr">
    <text x="72" y="778">+ value : string  «identidad»</text>
    <text x="72" y="801">+ va? : string</text>
    <text x="72" y="824">+ en? : string</text>
    <text x="72" y="847">— etiquetas de presentación</text>
  </g>

  <!-- DayConflict -->
  <rect class="hdr" x="510" y="60" width="300" height="34"/>
  <rect class="cls" x="510" y="94" width="300" height="128"/>
  <text class="name" x="660" y="84">DayConflict</text>
  <g class="attr">
    <text x="522" y="116">+ date : string</text>
    <text x="522" y="139">+ severity : ConflictSeverity</text>
    <text x="522" y="162">+ exams : Exam[]</text>
    <text x="522" y="185">+ pairs : ConflictPair[]</text>
    <text x="522" y="208">— un día problemático</text>
  </g>

  <!-- ConflictPair -->
  <rect class="hdr" x="510" y="286" width="300" height="34"/>
  <rect class="cls" x="510" y="320" width="300" height="104"/>
  <text class="name" x="660" y="310">ConflictPair</text>
  <g class="attr">
    <text x="522" y="342">+ a, b : Exam</text>
    <text x="522" y="365">+ overlapMinutes : number</text>
    <text x="522" y="388">+ gapMinutes : number | null</text>
    <text x="522" y="411">— dos exámenes en conflicto</text>
  </g>

  <!-- ConflictSeverity enum -->
  <rect class="hdr" x="510" y="490" width="300" height="34"/>
  <rect class="cls" x="510" y="524" width="300" height="104"/>
  <text class="name" x="660" y="514">ConflictSeverity</text>
  <text class="ster" x="660" y="546">«enumeración»</text>
  <g class="attr">
    <text x="522" y="572">overlap — se solapan</text>
    <text x="522" y="595">tight — menos de 60 min</text>
    <text x="522" y="618">busy — 3 o más el mismo día</text>
  </g>

  <!-- UserCalendar -->
  <rect class="hdr" x="510" y="722" width="300" height="34"/>
  <rect class="cls" x="510" y="756" width="300" height="104"/>
  <text class="name" x="660" y="746">UserCalendar</text>
  <g class="attr">
    <text x="522" y="778">+ id : uuid</text>
    <text x="522" y="801">+ user_id : uuid</text>
    <text x="522" y="824">+ name : string</text>
    <text x="522" y="847">+ filters : ExamFilters  «jsonb»</text>
  </g>

  <!-- modules -->
  <rect class="hdr" x="960" y="60" width="300" height="34"/>
  <rect class="cls" x="960" y="94" width="300" height="128"/>
  <text class="name" x="1110" y="84">exam-query</text>
  <text class="ster" x="1110" y="116">«módulo · funciones puras»</text>
  <g class="attr">
    <text x="972" y="142">+ normalizeFilters(f) : Normalized</text>
    <text x="972" y="165">+ parseSubjects(s[]) : Selector[]</text>
    <text x="972" y="188">+ subjectCondition(sel) : string</text>
    <text x="972" y="211">+ pgrstLiteral(v) : string</text>
  </g>

  <rect class="hdr" x="960" y="286" width="300" height="34"/>
  <rect class="cls" x="960" y="320" width="300" height="104"/>
  <text class="name" x="1110" y="310">exam-conflicts</text>
  <text class="ster" x="1110" y="342">«módulo · funciones puras»</text>
  <g class="attr">
    <text x="972" y="368">+ detectConflicts(e[]) : DayConflict[]</text>
    <text x="972" y="391">+ worstSeverity(c[]) : Severity?</text>
    <text x="972" y="414">— identidad = acrónimo + nombre</text>
  </g>

  <rect class="hdr" x="960" y="490" width="300" height="34"/>
  <rect class="cls" x="960" y="524" width="300" height="104"/>
  <text class="name" x="1110" y="514">ics</text>
  <text class="ster" x="1110" y="546">«módulo · RFC 5545»</text>
  <g class="attr">
    <text x="972" y="572">+ buildIcs(exams, opts) : string</text>
    <text x="972" y="595">+ parseIsoDuration(s) : number?</text>
  </g>

  <rect class="hdr" x="960" y="722" width="300" height="34"/>
  <rect class="cls" x="960" y="756" width="300" height="104"/>
  <text class="name" x="1110" y="746">exam-actions</text>
  <text class="ster" x="1110" y="778">«server actions»</text>
  <g class="attr">
    <text x="972" y="804">+ getExams(filters) : Exam[]</text>
    <text x="972" y="827">+ getFilterOptions(sel) : Options</text>
    <text x="972" y="850">— caché + invalidación por etiqueta</text>
  </g>

  <!-- relations -->
  <!-- DayConflict aggregates Exam -->
  <line class="rel" x1="510" y1="150" x2="360" y2="150"/>
  <polygon points="360,150 372,144 384,150 372,156" fill="#ffffff" stroke="#3f3f5a" stroke-width="1.6"/>
  <text class="lbl" x="398" y="142">0..*</text>

  <!-- ConflictPair to Exam -->
  <line class="rel" x1="510" y1="352" x2="420" y2="352" />
  <line class="rel" x1="420" y1="352" x2="420" y2="230"/>
  <line class="rel" x1="420" y1="230" x2="350" y2="230"/>
  <polygon points="350,230 362,224 374,230 362,236" fill="#ffffff" stroke="#3f3f5a" stroke-width="1.6"/>
  <text class="lbl" x="428" y="300">2</text>

  <!-- DayConflict composes ConflictPair -->
  <line class="rel" x1="660" y1="222" x2="660" y2="286"/>
  <polygon points="660,286 650,272 660,258 670,272" fill="#3f3f5a"/>
  <text class="lbl" x="672" y="256">0..*</text>

  <!-- DayConflict -> severity enum -->

  <!-- UserCalendar -> ExamFilters -->
  <line class="rel" x1="510" y1="800" x2="350" y2="800"/>
  <line class="rel" x1="430" y1="800" x2="430" y2="590"/>
  <line class="rel" x1="430" y1="590" x2="350" y2="590"/>
  <polygon points="350,590 362,584 374,590 362,596" fill="#ffffff" stroke="#3f3f5a" stroke-width="1.6"/>

  <!-- exam-conflicts ..> DayConflict -->
  <line class="rel" x1="960" y1="352" x2="810" y2="352" stroke-dasharray="6,4"/>
  <polygon points="810,352 824,346 824,358" fill="#3f3f5a"/>
  <text class="lbl" x="846" y="344">«produce»</text>

  <!-- exam-actions ..> Exam -->
  <g stroke-dasharray="6,4">
    <line class="rel" x1="960" y1="806" x2="906" y2="806"/>
    <line class="rel" x1="906" y1="806" x2="906" y2="884"/>
    <line class="rel" x1="906" y1="884" x2="30" y2="884"/>
    <line class="rel" x1="30" y1="884" x2="30" y2="210"/>
    <line class="rel" x1="30" y1="210" x2="60" y2="210"/>
  </g>
  <polygon points="60,210 46,204 46,216" fill="#3f3f5a"/>
  <text class="lbl" x="470" y="878">«devuelve» Exam[]</text>
</svg>
