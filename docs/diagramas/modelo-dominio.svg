<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1240" height="760" fill="#ffffff"/>
  <style>
    .box  { fill:#f6f6fa; stroke:#3f3f5a; stroke-width:1.8; }
    .hdr  { fill:#e3e3ee; stroke:#3f3f5a; stroke-width:1.8; }
    .name { font-size:19px; fill:#1a1a1a; font-weight:bold; text-anchor:middle; }
    .attr { font-size:14px; fill:#333; }
    .rel  { stroke:#3f3f5a; stroke-width:1.6; fill:none; }
    .card { font-size:14px; fill:#3f3f5a; }
    .role { font-size:13px; fill:#6a6a82; font-style:italic; }
  </style>

  <!-- ============ cadena académica ============ -->
  <!-- Escuela -->
  <rect class="hdr" x="40"  y="52" width="210" height="30"/>
  <rect class="box" x="40"  y="82" width="210" height="56"/>
  <text class="name" x="145" y="74">Escuela</text>
  <text class="attr" x="52" y="104">nombre</text>
  <text class="attr" x="52" y="126">acrónimo</text>

  <!-- Titulación -->
  <rect class="hdr" x="350" y="52" width="210" height="30"/>
  <rect class="box" x="350" y="82" width="210" height="56"/>
  <text class="name" x="455" y="74">Titulación</text>
  <text class="attr" x="362" y="104">nombre</text>
  <text class="attr" x="362" y="126">tipo (grado / máster)</text>

  <!-- Curso -->
  <rect class="hdr" x="660" y="52" width="210" height="30"/>
  <rect class="box" x="660" y="82" width="210" height="56"/>
  <text class="name" x="765" y="74">Curso</text>
  <text class="attr" x="672" y="104">número (1.º … 4.º)</text>
  <text class="attr" x="672" y="126">año académico</text>

  <!-- Semestre -->
  <rect class="hdr" x="970" y="52" width="210" height="30"/>
  <rect class="box" x="970" y="82" width="210" height="56"/>
  <text class="name" x="1075" y="74">Semestre</text>
  <text class="attr" x="982" y="104">designación (A / B)</text>
  <text class="attr" x="982" y="126">periodo</text>

  <!-- Asignatura -->
  <rect class="hdr" x="970" y="286" width="210" height="30"/>
  <rect class="box" x="970" y="316" width="210" height="78"/>
  <text class="name" x="1075" y="308">Asignatura</text>
  <text class="attr" x="982" y="338">nombre</text>
  <text class="attr" x="982" y="360">acrónimo</text>
  <text class="attr" x="982" y="382">nombre en va / en</text>

  <!-- Examen -->
  <rect class="hdr" x="970" y="540" width="210" height="30"/>
  <rect class="box" x="970" y="570" width="210" height="100"/>
  <text class="name" x="1075" y="562">Examen</text>
  <text class="attr" x="982" y="592">fecha</text>
  <text class="attr" x="982" y="614">hora de inicio</text>
  <text class="attr" x="982" y="636">duración</text>
  <text class="attr" x="982" y="658">observaciones</text>

  <!-- Aula -->
  <rect class="hdr" x="640" y="556" width="200" height="30"/>
  <rect class="box" x="640" y="586" width="200" height="56"/>
  <text class="name" x="740" y="578">Aula</text>
  <text class="attr" x="652" y="608">identificador</text>
  <text class="attr" x="652" y="630">edificio</text>

  <!-- ============ lado del usuario ============ -->
  <!-- Usuario -->
  <rect class="hdr" x="40" y="286" width="210" height="30"/>
  <rect class="box" x="40" y="316" width="210" height="56"/>
  <text class="name" x="145" y="308">Usuario</text>
  <text class="attr" x="52" y="338">correo electrónico</text>
  <text class="attr" x="52" y="360">nombre</text>

  <!-- Calendario -->
  <rect class="hdr" x="40" y="540" width="210" height="30"/>
  <rect class="box" x="40" y="570" width="210" height="78"/>
  <text class="name" x="145" y="562">Calendario</text>
  <text class="attr" x="52" y="592">nombre</text>
  <text class="attr" x="52" y="614">fecha de creación</text>
  <text class="attr" x="52" y="636">criterios de selección</text>

  <!-- ============ relaciones ============ -->
  <!-- Escuela 1..* Titulación -->
  <line class="rel" x1="250" y1="110" x2="350" y2="110"/>
  <text class="card" x="258" y="102">1</text>
  <text class="card" x="330" y="102">*</text>
  <text class="role" x="262" y="130">imparte</text>

  <!-- Titulación 1..* Curso -->
  <line class="rel" x1="560" y1="110" x2="660" y2="110"/>
  <text class="card" x="568" y="102">1</text>
  <text class="card" x="640" y="102">*</text>
  <text class="role" x="574" y="130">se organiza en</text>

  <!-- Curso 1..2 Semestre -->
  <line class="rel" x1="870" y1="110" x2="970" y2="110"/>
  <text class="card" x="878" y="102">1</text>
  <text class="card" x="952" y="102">2</text>
  <text class="role" x="884" y="130">consta de</text>

  <!-- Semestre 1..* Asignatura -->
  <line class="rel" x1="1075" y1="138" x2="1075" y2="286"/>
  <text class="card" x="1085" y="158">1</text>
  <text class="card" x="1085" y="278">*</text>
  <text class="role" x="1085" y="216">agrupa</text>

  <!-- Asignatura 1..* Examen -->
  <line class="rel" x1="1075" y1="394" x2="1075" y2="540"/>
  <text class="card" x="1085" y="414">1</text>
  <text class="card" x="1085" y="532">*</text>
  <text class="role" x="1085" y="470">se evalúa en</text>

  <!-- Examen *..1 Aula -->
  <line class="rel" x1="840" y1="614" x2="970" y2="614"/>
  <text class="card" x="952" y="606">*</text>
  <text class="card" x="848" y="606">1</text>
  <text class="role" x="856" y="634">se celebra en</text>

  <!-- Usuario 1..* Calendario -->
  <line class="rel" x1="145" y1="372" x2="145" y2="540"/>
  <text class="card" x="155" y="392">1</text>
  <text class="card" x="155" y="532">*</text>
  <text class="role" x="155" y="462">guarda</text>

  <!-- Calendario *..* Asignatura -->
  <line class="rel" x1="250" y1="600" x2="440" y2="600"/>
  <line class="rel" x1="440" y1="600" x2="440" y2="430"/>
  <line class="rel" x1="440" y1="430" x2="1075" y2="430"/>
  <text class="card" x="258" y="592">*</text>
  <text class="card" x="1045" y="422">*</text>
  <text class="role" x="600" y="422">selecciona</text>

  <!-- nota -->
  <path d="M300 668 h340 v76 h-328 l-12 -12 z" fill="#fbfbfd" stroke="#9a9ab0" stroke-width="1.3"/>
  <text class="attr" x="314" y="692">Un calendario guardado no copia exámenes:</text>
  <text class="attr" x="314" y="714">retiene los criterios con los que se seleccionan,</text>
  <text class="attr" x="314" y="736">de modo que refleja siempre el dato vigente.</text>
  <line class="rel" x1="300" y1="700" x2="250" y2="640" stroke="#9a9ab0" stroke-dasharray="5,4"/>
</svg>
