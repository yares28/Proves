<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="620" viewBox="0 0 1260 620" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1260" height="620" fill="#ffffff"/>
  <style>
    .frame { fill:#ffffff; stroke:#3f3f5a; stroke-width:2; }
    .zone  { fill:#f2f2f6; stroke:#9a9ab0; stroke-width:1.2; }
    .field { fill:#ffffff; stroke:#9a9ab0; stroke-width:1.2; }
    .bar   { fill:#d8d8e2; }
    .btn   { fill:#c2c2da; stroke:#6a6a82; stroke-width:1.2; }
    .lbl   { font-size:12.5px; fill:#3f3f5a; }
    .cap   { font-size:15px; fill:#1a1a1a; text-anchor:middle; font-weight:bold; }
    .tiny  { font-size:11px; fill:#6a6a82; }
  </style>

  <!-- ================= 1. Portada con búsqueda rápida ================= -->
  <text class="cap" x="200" y="26">a) Portada y búsqueda rápida</text>
  <rect class="frame" x="40" y="40" width="320" height="520" rx="4"/>
  <!-- cabecera -->
  <rect class="zone" x="40" y="40" width="320" height="34"/>
  <rect class="bar"  x="54" y="52" width="70" height="11"/>
  <rect class="bar"  x="270" y="52" width="24" height="11"/>
  <rect class="bar"  x="300" y="52" width="24" height="11"/>
  <text class="tiny" x="132" y="62">cabecera · idioma · cuenta</text>
  <!-- hero -->
  <rect class="zone" x="56" y="90" width="288" height="96"/>
  <rect class="bar"  x="76" y="108" width="200" height="16"/>
  <rect class="bar"  x="76" y="132" width="248" height="9"/>
  <rect class="bar"  x="76" y="146" width="210" height="9"/>
  <text class="tiny" x="76" y="176">titular + subtítulo</text>
  <!-- tarjeta de búsqueda rápida -->
  <rect class="zone" x="56" y="202" width="288" height="186"/>
  <text class="lbl"  x="70" y="222">Búsqueda rápida</text>
  <rect class="field" x="70" y="232" width="260" height="26"/><text class="tiny" x="78" y="249">escuela ▾</text>
  <rect class="field" x="70" y="266" width="260" height="26"/><text class="tiny" x="78" y="283">titulación ▾</text>
  <rect class="field" x="70" y="300" width="260" height="26"/><text class="tiny" x="78" y="317">asignatura o acrónimo ▾</text>
  <rect class="btn"   x="70" y="342" width="260" height="30" rx="3"/><text class="tiny" x="160" y="361">Buscar exámenes</text>
  <!-- secciones inferiores -->
  <rect class="zone" x="56" y="404" width="288" height="60"/><text class="tiny" x="70" y="438">estadísticas</text>
  <rect class="zone" x="56" y="478" width="288" height="66"/><text class="tiny" x="70" y="514">preguntas frecuentes</text>

  <!-- ================= 2. Filtros + calendario ================= -->
  <text class="cap" x="630" y="26">b) Filtros en cascada y calendario</text>
  <rect class="frame" x="400" y="40" width="460" height="520" rx="4"/>
  <rect class="zone" x="400" y="40" width="460" height="34"/>
  <rect class="bar"  x="414" y="52" width="70" height="11"/>
  <!-- panel lateral de filtros -->
  <rect class="zone" x="416" y="90" width="150" height="454"/>
  <text class="lbl"  x="428" y="110">Filtros</text>
  <rect class="bar"  x="428" y="120" width="90" height="9"/>
  <text class="tiny" x="428" y="146">Escuela</text>
  <rect class="field" x="428" y="152" width="126" height="18"/>
  <rect class="field" x="428" y="174" width="126" height="18"/>
  <text class="tiny" x="428" y="200">Titulación</text>
  <rect class="field" x="428" y="206" width="126" height="18"/>
  <rect class="field" x="428" y="228" width="126" height="18"/>
  <text class="tiny" x="428" y="254">Semestre · Curso</text>
  <rect class="field" x="428" y="260" width="126" height="18"/>
  <rect class="field" x="428" y="282" width="126" height="18"/>
  <text class="tiny" x="428" y="308">Asignatura</text>
  <rect class="field" x="428" y="314" width="126" height="18"/>
  <rect class="field" x="428" y="336" width="126" height="18"/>
  <rect class="btn"   x="428" y="372" width="126" height="26" rx="3"/><text class="tiny" x="452" y="389">Guardar vista</text>
  <text class="tiny" x="428" y="420">cada nivel se</text>
  <text class="tiny" x="428" y="436">habilita con el</text>
  <text class="tiny" x="428" y="452">anterior</text>
  <!-- zona de resultados -->
  <rect class="zone" x="582" y="90" width="262" height="34"/>
  <text class="tiny" x="594" y="112">aviso de conflictos de horario</text>
  <!-- conmutador de vista -->
  <rect class="btn"   x="582" y="136" width="80" height="24" rx="3"/><text class="tiny" x="600" y="152">Calendario</text>
  <rect class="field" x="666" y="136" width="80" height="24" rx="3"/><text class="tiny" x="694" y="152">Lista</text>
  <rect class="field" x="770" y="136" width="74" height="24" rx="3"/><text class="tiny" x="784" y="152">Exportar</text>
  <!-- rejilla mensual -->
  <rect class="field" x="582" y="176" width="262" height="230"/>
  <g stroke="#c8c8d6" stroke-width="1">
    <line x1="582" y1="204" x2="844" y2="204"/>
    <line x1="582" y1="244" x2="844" y2="244"/><line x1="582" y1="284" x2="844" y2="284"/>
    <line x1="582" y1="324" x2="844" y2="324"/><line x1="582" y1="364" x2="844" y2="364"/>
    <line x1="619" y1="176" x2="619" y2="406"/><line x1="656" y1="176" x2="656" y2="406"/>
    <line x1="693" y1="176" x2="693" y2="406"/><line x1="730" y1="176" x2="730" y2="406"/>
    <line x1="767" y1="176" x2="767" y2="406"/><line x1="807" y1="176" x2="807" y2="406"/>
  </g>
  <rect class="bar" x="661" y="250" width="27" height="8"/>
  <rect class="bar" x="735" y="290" width="27" height="8"/>
  <rect class="bar" x="624" y="330" width="27" height="8"/>
  <text class="tiny" x="594" y="196">rejilla mensual; los días con examen se marcan</text>
  <!-- próximos exámenes -->
  <rect class="zone" x="582" y="422" width="262" height="122"/>
  <text class="tiny" x="594" y="442">Próximos exámenes</text>
  <rect class="field" x="594" y="452" width="238" height="26"/>
  <rect class="field" x="594" y="484" width="238" height="26"/>
  <rect class="field" x="594" y="516" width="238" height="20"/>

  <!-- ================= 3. Vista de lista ================= -->
  <text class="cap" x="1060" y="26">c) Vista de lista</text>
  <rect class="frame" x="900" y="40" width="320" height="520" rx="4"/>
  <rect class="zone" x="900" y="40" width="320" height="34"/>
  <rect class="bar"  x="914" y="52" width="70" height="11"/>
  <!-- buscador propio -->
  <rect class="field" x="916" y="90" width="288" height="26"/><text class="tiny" x="924" y="107">buscar en los resultados…</text>
  <!-- cabecera de tabla -->
  <rect class="zone" x="916" y="128" width="288" height="26"/>
  <text class="tiny" x="924" y="145">Fecha</text>
  <text class="tiny" x="990" y="145">Asignatura</text>
  <text class="tiny" x="1092" y="145">Hora</text>
  <text class="tiny" x="1146" y="145">Aula</text>
  <!-- filas -->
  <g>
    <rect class="field" x="916" y="154" width="288" height="30"/>
    <rect class="bar" x="924" y="164" width="46" height="9"/><rect class="bar" x="990" y="164" width="86" height="9"/>
    <rect class="bar" x="1092" y="164" width="34" height="9"/><rect class="bar" x="1146" y="164" width="42" height="9"/>
    <rect class="field" x="916" y="184" width="288" height="30"/>
    <rect class="bar" x="924" y="194" width="46" height="9"/><rect class="bar" x="990" y="194" width="70" height="9"/>
    <rect class="bar" x="1092" y="194" width="34" height="9"/><rect class="bar" x="1146" y="194" width="42" height="9"/>
    <rect class="field" x="916" y="214" width="288" height="30"/>
    <rect class="bar" x="924" y="224" width="46" height="9"/><rect class="bar" x="990" y="224" width="94" height="9"/>
    <rect class="bar" x="1092" y="224" width="34" height="9"/><rect class="bar" x="1146" y="224" width="42" height="9"/>
    <rect class="field" x="916" y="244" width="288" height="30"/>
    <rect class="bar" x="924" y="254" width="46" height="9"/><rect class="bar" x="990" y="254" width="78" height="9"/>
    <rect class="bar" x="1092" y="254" width="34" height="9"/><rect class="bar" x="1146" y="254" width="42" height="9"/>
    <rect class="field" x="916" y="274" width="288" height="30"/>
    <rect class="bar" x="924" y="284" width="46" height="9"/><rect class="bar" x="990" y="284" width="88" height="9"/>
    <rect class="bar" x="1092" y="284" width="34" height="9"/><rect class="bar" x="1146" y="284" width="42" height="9"/>
  </g>
  <text class="tiny" x="916" y="326">ordenada por fecha; el buscador filtra sobre lo ya seleccionado</text>
  <!-- versión móvil -->
  <text class="lbl" x="916" y="368">Adaptación móvil</text>
  <rect class="frame" x="916" y="380" width="120" height="164" rx="4"/>
  <rect class="zone" x="916" y="380" width="120" height="22"/>
  <rect class="field" x="926" y="412" width="100" height="20"/>
  <rect class="field" x="926" y="438" width="100" height="34"/>
  <rect class="field" x="926" y="478" width="100" height="34"/>
  <text class="tiny" x="1050" y="404">el panel de filtros</text>
  <text class="tiny" x="1050" y="420">se pliega sobre</text>
  <text class="tiny" x="1050" y="436">el contenido</text>
  <text class="tiny" x="1050" y="468">las tarjetas</text>
  <text class="tiny" x="1050" y="484">sustituyen a</text>
  <text class="tiny" x="1050" y="500">la tabla</text>
</svg>
