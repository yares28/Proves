name: Web app CI

# Gates for the Next.js app itself. sync-exams.yml covers the scraper
# separately and already runs its own tests before every sync.
#
# Type-check and lint are real gates: both are clean today, so anything red
# here is a genuine new regression.
#
# Jest is a real gate. The pre-existing pile of failing auth/component tests
# that this file used to describe has been repaired: the suite is green
# (21 files, 176 tests), so a red Jest step now means a genuine regression.
#
# Coverage is gated too. jest.config.js sets per-area thresholds rather than one
# global number: lib/ and utils/ hold the rules worth protecting (PostgREST
# escaping, ICS generation, conflict detection, date handling) and are held to a
# high bar, while the global floor only stops overall coverage sliding back.
# Every threshold is currently met, so a failure here is a real drop.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests + coverage thresholds
        run: npx jest --ci --coverage --watchAll=false
