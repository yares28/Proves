name: Web app CI

# Gates for the Next.js app itself. sync-exams.yml covers the scraper
# separately and already runs its own tests before every sync.
#
# Type-check and lint are real gates: both are clean today, so anything red
# here is a genuine new regression.
#
# Jest is NOT a gate yet. The suite currently has ~76 failing tests across 17
# files (auth forms describing UI that no longer exists — unrelated to any
# recent change, confirmed pre-existing). Failing the build on that today would
# make every PR red regardless of what it touches, which trains reviewers to
# ignore CI rather than read it. It runs and reports so a NEW regression is
# still visible in the log, and the count is printed so the debt doesn't hide.
# Once that pre-existing pile is fixed, flip `continue-on-error: false` on the
# jest step below to make it a real gate.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests (report only, not yet a gate — see file header)
        id: jest
        continue-on-error: true
        run: npx jest --ci --watchAll=false

      - name: Summarize test status
        run: |
          if [ "${{ steps.jest.outcome }}" = "failure" ]; then
            echo "::warning::Jest has failing tests. This does not fail the build yet — see the comment at the top of .github/workflows/ci.yml for why, and the Tests step above for which ones."
          fi
